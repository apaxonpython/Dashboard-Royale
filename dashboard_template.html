<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Gilded Ace floor review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f8;--sf:#fff;--ink:#16202b;--mu:#5b6877;--ln:#d9dfe6;--rd:#b42318;--gd:#0f7b5f;--br:#9a6b00;--pri:#1f4e8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--sf:#172029;--ink:#e7ecf1;--mu:#9aa7b5;--ln:#2a3541;--rd:#f0867b;--gd:#4cc9a3;--br:#e0b04a;--pri:#7fb0f0}}
:root[data-theme="dark"]{--bg:#0f151b;--sf:#172029;--ink:#e7ecf1;--mu:#9aa7b5;--ln:#2a3541;--rd:#f0867b;--gd:#4cc9a3;--br:#e0b04a;--pri:#7fb0f0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1000px;margin:0 auto;padding:18px 16px 48px}h1{font-size:25px;line-height:1.2;margin:4px 0 6px;font-weight:600;max-width:34ch}h2{font-size:18px;margin:26px 0 8px;font-weight:600}p{margin:6px 0;max-width:70ch}.mu{color:var(--mu);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 11px;font:inherit;color:var(--mu);cursor:pointer}nav button[aria-current=true]{color:var(--ink);border-color:var(--pri);font-weight:600}
button:focus-visible,select:focus-visible,.bar:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
select{font:inherit;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:5px 8px}label{font-size:13px;color:var(--mu);margin-right:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin:10px 0}.kp{display:flex;flex-wrap:wrap;gap:22px;margin:8px 0}.kp b{display:block;font-size:22px;font-weight:600}.kp span{font-size:13px;color:var(--mu)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--ln);vertical-align:top}th{font-weight:500;color:var(--mu);font-size:13px}td.n,th.n{text-align:right}
svg{width:100%;height:auto;display:block}.gl{stroke:var(--ln)}.ax{font-size:11px;fill:var(--mu)}.lb{font-size:12px;fill:var(--ink)}.bar{cursor:pointer}
.chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;border:1px solid currentColor}.rd{color:var(--rd)}.gd{color:var(--gd)}.br{color:var(--br)}.pri{color:var(--pri)}
.go{background:none;border:0;color:var(--pri);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
</style></head><body><main>
<div class="top"><div><h1 id="h"></h1><p class="mu" id="sub"></p></div><div><label for="a">Period</label><select id="a"></select> <label for="b">to</label><select id="b"></select><div class="mu" id="pn"></div></div></div>
<nav id="nav"></nav><div id="v"></div>
<p class="mu">The casino and all of its machine and player data are synthetic. Real public data (tourism, weather) was not used in these charts. Unusual results are leads to inspect, not proof of wrongdoing. Built with Claude’s help.</p></main>
<script>
const D=__D__;
const $=s=>document.querySelector(s),f0=n=>Math.round(n).toLocaleString('en-US'),usd=n=>(n<0?'−':'')+'$'+f0(Math.abs(n)),kk=n=>'$'+(n/1000).toFixed(Math.abs(n)>=1e5?0:1)+'k',mm=n=>'$'+(n/1e6).toFixed(2)+'M';
const ML=['Jan','Feb','Mar','Apr','May','Jun'];let S={t:'q1',a:0,b:5,z:'Back Forty',g:'reg'};
const T=[['q1','Weak machines'],['q2','Demand'],['fc','Forecast check'],['q3','Downtime'],['q4','Players'],['q5','Comps'],['q6','$100K plan']];
const H={q1:['Eight of the manager’s ten “worst” machines sit in one zone','Back Forty gets about 40% less play per machine-hour than the rest of the floor. Most of the list is a location problem, not a machine problem. Covers Jan to Jun.'],q2:['Demand peaked in Feb and Mar, then cooled','Fewer visitors came through the doors in June, and eight added machines split the play. Floor-wide.'],fc:['A weekday forecast beats a flat average by about 69%','Trained on Jan to Apr, frozen, then tested on May and June.'],q3:['Downtime cost about $92k of house win, and Ridgeline is the cause','Machines were available over 99.6% of the time. The losses concentrate in one manufacturer.'],q4:['Ten percent of card players account for 59% of player losses','Card holders only. Machine totals include everyone, so the two never match.'],q5:['Comps cost more each month, and the points exchange rate halved in May','Comp cost is still small next to the money players wager.'],q6:['Spend $25,200 on three actions and keep $74,800','Every action traces back to a finding in the other tabs.']};
function line(ss,o){const W=640,Hh=o.h||220,p={l:50,r:10,t:10,b:24},n=o.n;let al=ss.flatMap(s=>s.v.filter(v=>v!=null)),lo=o.min??Math.min(...al),hi=Math.max(...al),sp=(hi-lo)||1;lo-=sp*.06;hi+=sp*.06;const X=i=>p.l+(W-p.l-p.r)*(n<2?.5:i/(n-1)),Y=v=>p.t+(Hh-p.t-p.b)*(1-(v-lo)/(hi-lo));let g='';for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${o.fy(v)}</text>`}(o.lab||[]).forEach(([i,t])=>g+=`<text x="${X(i)}" y="${Hh-6}" text-anchor="middle" class="ax">${t}</text>`);ss.forEach(s=>{let d='';s.v.forEach((v,i)=>{if(v!=null)d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.da?'stroke-dasharray="5 4"':''}/>`;(s.dots||[]).forEach(i=>g+=`<circle cx="${X(i)}" cy="${Y(s.v[i])}" r="4" fill="${s.c}"><title>${s.t[i]}</title></circle>`)});return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${o.al}">${g}</svg>`}
function hbar(it,o){const W=640,rh=30,l=o.l||140,mx=Math.max(...it.map(i=>i.v));let g='';it.forEach((x,i)=>{const y=i*rh,w=(W-l-80)*x.v/mx;g+=`<g class="bar" data-z="${x.id||''}" tabindex="${x.id?0:-1}"><text x="${l-8}" y="${y+19}" text-anchor="end" class="lb">${x.l}</text><rect x="${l}" y="${y+5}" width="${w}" height="20" rx="3" fill="${x.c||'var(--pri)'}"/><text x="${l+w+6}" y="${y+20}" class="lb">${o.f(x.v)}</text></g>`});return `<svg viewBox="0 0 ${W} ${it.length*rh+4}" role="img" aria-label="${o.al}">${g}</svg>`}
function vbar(it,o){const W=640,Hh=200,p={l:40,b:22,t:8},mx=Math.max(...it.map(i=>i.v)),bw=(W-p.l)/it.length;let g='';it.forEach((x,i)=>{const h=(Hh-p.b-p.t)*x.v/mx;g+=`<rect x="${p.l+i*bw+2}" y="${Hh-p.b-h}" width="${bw-4}" height="${h}" fill="${x.c||'var(--pri)'}"><title>${x.t||x.l}</title></rect><text x="${p.l+i*bw+bw/2}" y="${Hh-6}" text-anchor="middle" class="ax">${x.l}</text>`});g+=`<text x="${p.l-6}" y="${p.t+8}" text-anchor="end" class="ax">${o.f(mx)}</text><text x="${p.l-6}" y="${Hh-p.b}" text-anchor="end" class="ax">0</text>`;return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${o.al}">${g}</svg>`}
const tb=(h,r,n=[])=>`<div class="sc"><table><tr>${h.map((x,i)=>`<th class="${n.includes(i)?'n':''}">${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map((c,i)=>`<td class="${n.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const go=(t,l)=>`<button class="go" data-go="${t}">${l}</button>`;
const mo=()=>D.mo.slice(S.a,S.b+1);const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
function q1(){const z=D.zone.slice().sort((a,b)=>a.cph-b.cph);const bs=D.banks.filter(b=>b.z===S.z).sort((a,b)=>a.cph-b.cph);
return `<div class="card"><b>Wagers per machine-hour, by zone</b> <span class="mu">(select a zone to see its banks)</span>${hbar(z.map(x=>({l:x.z,v:x.cph,id:x.z,c:x.z==='Back Forty'?'var(--rd)':'var(--pri)'})),{f:v=>'$'+f0(v),al:'Wagers per machine-hour by zone'})}<p class="mu">Same game titles earn 35% to 45% less in Back Forty than elsewhere, so the games are not the cause. Back Forty’s actual hold (9.3%) is close to what its games are built to pay (9.6%), so luck is not the cause either. The one machine that moved out of Back Forty (M-1152, Feb 4) went from $119 to $245 per hour.</p></div>
<div class="card"><b>Banks in ${S.z}</b>${tb(['Bank','Machines','Wagers per hour','Hold'],bs.map(b=>[b.b,b.m,'$'+b.cph,b.hold+'%']),[1,2,3])}</div>
<h2>The manager’s bottom ten, and what explains each</h2><div class="card">${tb(['Machine','Zone','Days on floor','House win','Expected','Luck score','Verdict'],D.mach.filter(m=>m.bot).map(m=>[m.id,m.zone,m.days,usd(m.hw),usd(m.theo),m.z,m.v]),[2,3,4,5])}<p class="mu">Luck score: how many standard deviations the machine is from its expected result. Beyond ±3 is not plausible luck. This is my approximation using volatility class.</p></div>
<h2>Machines worth inspecting</h2><div class="card">${tb(['Machine','Zone','Hold','Built to hold','Luck score','Note'],D.mach.filter(m=>m.id==='M-1210'||m.id==='M-1010'||m.id==='M-1214'||m.id==='M-1158').map(m=>[m.id,m.zone,m.hold+'%',m.th+'%',m.z,m.v]),[2,3,4])}</div>`}
function q2(){const m=mo(),ds=D.daily.filter(r=>+r[0].slice(5,7)-1>=S.a&&+r[0].slice(5,7)-1<=S.b);const ci=ds.reduce((s,r)=>s+r[1],0)/ds.length,en=ds.reduce((s,r)=>s+r[2],0)/ds.length;const ev=ds.map((r,i)=>r[3]>=0?i:-1).filter(i=>i>=0);
return `<div class="kp"><div><b>${mm(ci*1000)}</b><span>wagers per day</span></div><div><b>${f0(en*1000)}</b><span>door and zone entries per day</span></div><div><b>$${(ci/en).toFixed(0)}</b><span>wagered per entry</span></div><div><b>${(sum(m,'ci_per_mh')/m.length).toFixed(0)}</b><span>wagered per machine-hour</span></div></div>
<div class="card"><b>Daily wagers ($ thousands)</b> <span class="mu">Dots mark event days (hover for the name).</span>${line([{v:ds.map(r=>r[1]),c:'var(--pri)',w:1.5},{v:ds.map(r=>r[3]>=0?r[1]:null),c:'var(--br)',w:0,dots:ev,t:ds.map(r=>r[3]>=0?D.evn[r[3]]+' '+r[0]:'')}],{n:ds.length,fy:v=>f0(v),lab:ds.map((r,i)=>[i,r[0].slice(5)]).filter((x,i)=>i%Math.ceil(ds.length/7)===0),al:'Daily wagers'})}</div>
<div class="card"><b>Monthly view</b>${tb(['Month','Wagers per day','Entries per day','Machines','Occupancy','Wagers per machine-hour'],m.map(r=>[r.m,usd(r.ci_day),f0(r.ent_day),r.am.toFixed(0),r.occ_rate.toFixed(1)+'%','$'+r.ci_per_mh.toFixed(0)]),[1,2,3,4,5])}<p class="mu">What changed: entries per day fell from 15.3k (Feb) to 14.0k (Jun), while wagers per entry stayed near $92 to $96. Machines grew from 300 to 308 in March and April, so each machine earned less. Competing explanation: some of the dip is June seasonality, which six months of data cannot separate.</p></div>
<div class="card"><b>Event lift, compared with a normal day of the same weekday</b>${tb(['Event','Days','Lift'],D.ev.slice().sort((a,b)=>b.l-a.l).map(e=>[e.n,e.d,(e.l>0?'+':'')+e.l+'%']),[1,2])}<p class="mu">Sports and festival weekends lift play 15% to 23%. Conventions barely move it (1% to 6%). Each event is only 3 to 7 days, so treat the numbers as rough.</p></div>`}
function fc(){const F=D.fc,ds=D.daily.filter(r=>r[0]>='2025-05-01'),wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],pr=ds.map(r=>F.wd[wd[new Date(r[0]+'T12:00:00').getDay()]]/1000),ev=ds.map((r,i)=>r[3]>=0?i:-1).filter(i=>i>=0);
return `<div class="card"><b>Mean absolute error on May and June (61 days)</b>${hbar([{l:'Weekday average',v:F.mae_w,c:'var(--gd)'},{l:'Flat average',v:F.mae_c,c:'var(--mu)'}],{l:130,f:v=>usd(v),al:'Forecast error'})}<p class="mu">Method: the average wagers for each weekday in Jan to Apr, frozen before testing. Baseline: one flat Jan to Apr daily average ($${f0(F.base)}). No holdout data was used for training, and no later data was used as an input. The forecast runs about $39k a day too high, so actual demand softened in May and June.</p></div>
<div class="card"><b>Actual and forecast ($ thousands)</b>${line([{v:ds.map(r=>r[1]),c:'var(--pri)',w:1.5},{v:pr,c:'var(--gd)',da:1,w:1.5},{v:ds.map(r=>r[3]>=0?r[1]:null),c:'var(--br)',w:0,dots:ev,t:ds.map(r=>r[3]>=0?D.evn[r[3]]:'')}],{n:ds.length,fy:v=>f0(v),lab:ds.map((r,i)=>[i,r[0].slice(5)]).filter((x,i)=>i%9===0),al:'Actual vs forecast wagers'})}<p class="mu">Solid blue: actual. Dashed green: forecast. Dots: event days, where the forecast misses most.</p></div>
<div class="card"><b>Decision it changes:</b> ${F.wd.Sat>F.wd.Tue?'Saturday averages '+usd(F.wd.Sat)+' against '+usd(F.wd.Tue)+' on Tuesday (+'+Math.round((F.wd.Sat/F.wd.Tue-1)*100)+'%). Staff and schedule maintenance by weekday, and put promotions where an event lift is likely.':''}${tb(['Weekday','Average wagers'],['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>[d,usd(F.wd[d])]),[1])}</div>`}
function q3(){const m=mo();return `<div class="kp"><div><b>${f0(sum(m,'lost_h'))}</b><span>machine-hours lost</span></div><div><b>${kk(sum(m,'lost_hw'))}</b><span>house win lost (estimate)</span></div><div><b>${(sum(m,'pct')/m.length).toFixed(2)}%</b><span>of scheduled time</span></div></div>
<div class="card"><b>Lost machine-hours by month</b>${vbar(m.map(r=>({l:ML[+r.m.slice(5)-1],v:r.lost_h,t:f0(r.lost_h)+' hours, about '+kk(r.lost_hw)})),{f:v=>f0(v),al:'Lost hours by month'})}<p class="mu">Estimate = lost hours × that machine’s own average wagers per hour × the floor’s hold (${D.hold}%).</p></div>
<div class="card"><b>By manufacturer (Jan to Jun)</b>${tb(['Manufacturer','Machines','Faults per machine','Time unavailable','Lost house win'],D.man.map(r=>[r.manufacturer,r.m,r.faults_per_machine,r.pct+'%',kk(r.lost_hw)]),[1,2,3,4])}</div>
<div class="card"><b>When faults happen (hour opened, local time)</b>${vbar(D.hr.map(r=>({l:r.hr,v:r.n,t:r.n+' faults, avg repair '+r.avg+' h'})),{f:v=>v,al:'Faults by hour'})}<p class="mu">Faults peak from 8 pm to 11 pm. Repairs that start after midnight take about 5 hours, against about 3.7 in the afternoon.</p></div>`}
function q4(){const Q=D.q4,rows=(S.g==='reg'?D.reg:D.tier),k=S.g==='reg'?'home_region':'opening_tier',tc=sum(rows,'ci');
return `<div class="kp"><div><b>${f0(Q.players)}</b><span>card holders</span></div><div><b>${mm(Q.ci)}</b><span>wagered</span></div><div><b>${mm(-Q.net)}</b><span>net player loss</span></div><div><b>${f0(Q.winners)}</b><span>players who came out ahead</span></div></div>
<div class="card"><b>Share of all player losses, by player group</b>${hbar([['Top 1%',1],['Top 5%',.05],['Top 10%',.1],['Top 20%',.2]].map(([l,q],i)=>({l,v:Q.conc[['0.01','0.05','0.1','0.2'][i]],c:'var(--br)'})),{l:90,f:v=>v+'%',al:'Loss concentration'})}<p class="mu">The top 10% of players also account for ${Q.ci_top10}% of wagers. Protective ideas, such as session reminders, fit this group. Nothing here should push heavy losers to play more.</p></div>
<div class="card"><label for="g">Group by</label><select id="g"><option value="reg" ${S.g==='reg'?'selected':''}>Home region</option><option value="tier" ${S.g==='tier'?'selected':''}>Loyalty tier</option></select>${tb(['Group','Players','Wagered','Player net','Net as % of wagers','Share of wagers'],rows.map(r=>[r[k],f0(r.n),mm(r.ci),usd(r.net),r.loss_pct_ci+'%',(r.ci/tc*100).toFixed(0)+'%']),[1,2,3,4,5])}<p class="mu">Locals are 7% of card holders but wager 59% of all carded play. Every group loses about 9% to 10% of what it wagers, so no group is being treated differently. Region and tier counts are not mutually exclusive over time.</p></div>`}
function q5(){const m=mo();return `<div class="kp"><div><b>${kk(sum(m,'cc'))}</b><span>comp cost in period</span></div><div><b>${m[m.length-1].ccp.toFixed(2)}%</b><span>of expected win, last month</span></div><div><b>${m[m.length-1].ppc.toFixed(1)}</b><span>points per comp dollar, last month</span></div></div>
<div class="card"><b>Points needed per comp dollar redeemed</b>${line([{v:m.map(r=>r.ppc),c:'var(--rd)'}],{n:m.length,min:0,fy:v=>v.toFixed(0),lab:m.map((r,i)=>[i,ML[+r.m.slice(5)-1]]),al:'Points per comp dollar'})}<p class="mu">It drifted from 13.9 to 12.5 through April, then fell to 5.8 in May. That one-month break looks like a policy change, not player behavior. Monthly data cannot show the exact day, and the loyalty ledger could. Share of earned points redeemed also halved (5.3% to 2.6%).</p></div>
<div class="card"><b>Comp cost as % of expected win</b>${line([{v:m.map(r=>r.ccp),c:'var(--br)'}],{n:m.length,fy:v=>v.toFixed(2),lab:m.map((r,i)=>[i,ML[+r.m.slice(5)-1]]),al:'Comp cost share'})}<p class="mu">Comp cost rose from ${kk(D.mo[0].cc)} in Jan to ${kk(D.mo[5].cc)} in Jun (+15%). It is still about 1.2% of expected win, so it is a small line item. Comp cost is counted once, never also through cost of goods.</p></div>`}
const P=[['Inspect 4 machines','M-1158, M-1210, M-1010, M-1214','4 × $1,200',4800,[0,3000,7000],'M-1158’s $36k shortfall vs expectation is $6k a month. Fixing a wrong payout setting recovers some of it.','Rerun luck scores after 30 days; pass if M-1158 is back inside ±3.','q1','Information, not a guaranteed finding. Low case: nothing is wrong.'],
['Move 3 machines','Three Back Forty machines (M-1035, M-1017, M-1265) to empty slots L-07-3, L-12-1 (Center Pit) and L-40-6 (Hotel Corridor)','3 × $1,800',5400,[4700,9500,23900],'M-1152 went from $119 to $245 per hour after leaving Back Forty. We assume +$25, +$50 or +$126 per hour for 28 days at a 9.4% hold.','Compare each machine’s per-hour wagers before and after, against its game peers.','q1','Only one past move to learn from. Empty slots must be confirmed.'],
['Promotion weekend','One weekend, Jul 18 to 20 (14-day lead means the earliest start is Jul 15)','1 × $15,000',15000,[13400,44600,78900],'Past sports and festival weekends lifted play 15% to 23%; the Locals Appreciation Week lifted it only 4%. We assume +3%, +10% or +17.7% on a $4.74M weekend at a 9.4% hold.','Compare actual wagers with the weekday forecast and with a normal weekend.','fc','Wide range: the low case loses money. Break-even is a 3.4% lift. Do not target heavy losers.']];
function q6(){const c=P.reduce((s,x)=>s+x[3],0),g=[0,1,2].map(i=>P.reduce((s,x)=>s+x[4][i],0));
return `<div class="kp"><div><b>${usd(c)}</b><span>spent of $100,000</span></div><div><b>${usd(100000-c)}</b><span>kept</span></div><div><b>${kk(g[0]-c)} / ${kk(g[1]-c)} / ${kk(g[2]-c)}</b><span>net after cost: low / likely / high</span></div></div>
${P.map(x=>`<div class="card"><b>${x[0]}</b> <span class="chip pri">${x[2]}</span><p>${x[1]}</p><p><b>Expected effect (30 days of house win):</b> ${kk(x[4][0])} / ${kk(x[4][1])} / ${kk(x[4][2])}. ${x[5]}</p><p><b>Uncertainty:</b> ${x[8]}</p><p><b>How we will measure it:</b> ${x[6]}</p><p class="mu">Evidence: ${go(x[7],'see the supporting charts')}</p></div>`).join('')}
<div class="card"><b>Considered and not funded</b>${tb(['Action','Why not'],[['Replace machines (leased $3,380 each or purchased $22,000)','Replacing a machine does not fix a weak spot. No bottom-ten machine shows a machine-level problem except M-1158, which needs inspection first.'],['Technician shift ($11,520) or Ridgeline maintenance ($9,000)','All downtime costs about $15k a month. Neither pays back inside 30 days.'],['Signage for Back Forty ($7,500)','Plausible, but no evidence yet. The moves test comes first.'],['Comp pilot or comp change','Comp cost is about 1.2% of expected win. A pilot needs the May rate change explained first.']],[])}</div>`}
const V={q1,q2,fc,q3,q4,q5,q6};
function draw(){$('#h').textContent=H[S.t][0];$('#sub').textContent=H[S.t][1];$('#nav').innerHTML=T.map(([k,l])=>`<button data-t="${k}" aria-current="${k===S.t}">${l}</button>`).join('');$('#v').innerHTML=V[S.t]();$('#pn').textContent=['q2','q3','q5'].includes(S.t)?'Period applies to this tab.':'Fixed period: Jan to Jun 2025 (forecast: May to Jun).';
const o=ML.map((l,i)=>`<option value="${i}">${l}</option>`).join('');['a','b'].forEach(i=>{const e=$('#'+i);e.innerHTML=o;e.value=S[i]})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]'),g=e.target.closest('[data-go]'),b=e.target.closest('.bar');if(t)S.t=t.dataset.t;else if(g)S.t=g.dataset.go;else if(b&&b.dataset.z)S.z=b.dataset.z;else return;draw()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('bar')){S.z=e.target.dataset.z||S.z;draw()}});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='a'||i==='b'){S[i]=+e.target.value;if(S.a>S.b){if(i==='a')S.b=S.a;else S.a=S.b}}else if(i==='g')S.g=e.target.value;else return;draw()});
draw();
</script></body></html>
